version: "2"

linters:
  default: none
  enable:
    - govet
    - staticcheck
  settings:
    staticcheck:
      checks:
        - "all"
        - "-QF*"       # quickfix suggestions are too noisy
        - "-ST*"        # style suggestions
        - "-SA4*"       # pre-existing suspicious construct warnings
        - "-SA9*"       # empty branches (intentional)
        - "-S1*"        # simplification suggestions (style preference)

exclusions:
  rules:
    - path: _test\.go
      linters:
        - staticcheck
